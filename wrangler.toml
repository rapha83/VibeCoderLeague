name = "vibecoderleague"
main = "src/worker.ts"
compatibility_date = "2024-12-18"
workers_dev = true

[vars]
# Exact production origin; do not include a trailing slash.
PUBLIC_ORIGIN = "https://viberivals.com"

[assets]
directory = "./src/frontend"
binding = "ASSETS"
# Supported by the installed Wrangler schema; canonical host guard must cover assets.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "vibe-coder-league"
database_id = "a5fcb38c-026a-4bd3-9f93-a2822cf067b4"

# Deliberately no [triggers] cron: it is enabled only after a real GitHub-App
# authorization, consent, and public-repository sync journey has succeeded.
