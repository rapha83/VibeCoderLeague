name = "vibe-coder-league"
main = "src/worker.ts"
compatibility_date = "2024-12-18"
workers_dev = true

[assets]
directory = "./src/frontend"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "vibe-coder-league"
database_id = "replace-with-d1-database-id"

[triggers]
crons = ["*/15 * * * *"]
